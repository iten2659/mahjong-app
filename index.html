<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🀄 麻雀収支計算＆成績管理アプリ</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #00e676;
            --accent-hover: #00c853;
            --text-color: #ffffff;
            --text-sub: #b0bec5;
            --danger-color: #ff5252;
            --border-color: #333333;
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 12px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 550px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.6);
        }

        h1 {
            font-size: 1.3rem;
            text-align: center;
            color: var(--accent-color);
            margin: 0 0 16px 0;
        }

        /* タブナビゲーション */
        .tab-nav {
            display: flex;
            background: #2a2a2a;
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 20px;
            gap: 2px;
        }

        .tab-btn {
            flex: 1;
            padding: 8px 2px;
            background: none;
            border: none;
            color: var(--text-sub);
            font-weight: bold;
            font-size: 0.75rem;
            cursor: pointer;
            border-radius: 6px;
            transition: 0.2s;
            text-align: center;
        }

        .tab-btn.active {
            background: var(--accent-color);
            color: #000;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* 入力フォームスタイル */
        .section-title {
            font-size: 0.85rem;
            color: var(--accent-color);
            margin: 16px 0 8px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 4px;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .input-field {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 0.75rem;
            margin-bottom: 4px;
            color: var(--text-sub);
        }

        input, select {
            background: #2a2a2a;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            width: 100%;
        }

        input:focus, select:focus {
            border-color: var(--accent-color);
        }

        .player-row {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 10px;
        }

        .player-row select.p-seat { width: 18%; }
        .player-row select.p-name-select { width: 32%; }
        .player-row input.p-score { flex: 1; }
        .player-row input.p-chip { width: 20%; }

        button.primary-btn {
            width: 100%;
            background: var(--accent-color);
            color: #000;
            font-weight: bold;
            font-size: 0.95rem;
            padding: 12px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.2s;
        }

        button.primary-btn:hover { background: var(--accent-hover); }

        button.secondary-btn {
            background: #333;
            color: #fff;
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        /* 結果カード・テーブル */
        .card {
            background: #252525;
            padding: 14px;
            border-radius: 10px;
            margin-bottom: 14px;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.9rem;
        }

        .result-row:last-child { border-bottom: none; }

        .plus { color: var(--accent-color); font-weight: bold; }
        .minus { color: var(--danger-color); font-weight: bold; }

        .error-msg {
            color: var(--danger-color);
            font-size: 0.85rem;
            text-align: center;
            margin-top: 10px;
            background: rgba(255,82,82,0.1);
            padding: 8px;
            border-radius: 6px;
            display: none;
        }

        /* 成績カードスタイル */
        .player-stats-card {
            background: #252525;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
            border: 1px solid var(--border-color);
        }

        .stats-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 6px;
            margin-bottom: 8px;
        }

        .stats-name {
            font-size: 1.05rem;
            font-weight: bold;
        }

        .stats-total-val {
            font-size: 0.95rem;
            text-align: right;
        }

        .stats-body {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
        }

        .rank-counts {
            display: flex;
            gap: 6px;
        }

        .rank-badge {
            background: #1a1a1a;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.8rem;
            color: var(--text-sub);
        }

        .rank-badge span {
            color: #fff;
            font-weight: bold;
        }

        .member-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: #2a2a2a;
            border-radius: 8px;
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🀄 麻雀収支計算＆成績管理</h1>

    <!-- 4タブ切り替え -->
    <div class="tab-nav">
        <button class="tab-btn active" onclick="switchTab('memberTab')">👥 メンバー</button>
        <button class="tab-btn" onclick="switchTab('ruleTab')">⚙️ ルール</button>
        <button class="tab-btn" onclick="switchTab('inputTab')">🀄 半荘入力</button>
        <button class="tab-btn" onclick="switchTab('historyTab')">📊 トータル</button>
    </div>

    <!-- 1. メンバーリストタブ -->
    <div id="memberTab" class="tab-content active">
        <div class="section-title">👥 メンバー登録・管理</div>
        <div class="input-group">
            <input type="text" id="newMemberName" placeholder="メンバー名を入力">
            <button class="secondary-btn" style="width:100px; background:var(--accent-color); color:#000; font-weight:bold;" onclick="addMember()">追加</button>
        </div>
        <div id="memberList" style="margin-top:15px;">
            <!-- メンバー一覧が動的表示されます -->
        </div>
    </div>

    <!-- 2. ルール設定タブ -->
    <div id="ruleTab" class="tab-content">
        <div class="section-title">👥 対局形式＆参加メンバー</div>
        <div class="input-group">
            <div class="input-field">
                <label>ゲーム形式</label>
                <select id="gameType" onchange="toggleGameType()">
                    <option value="4">4人打ち</option>
                    <option value="3">3人打ち</option>
                </select>
            </div>
        </div>

        <div id="playerNamesContainer">
            <!-- JavaScriptで対局メンバー選択プルダウンを動的生成 -->
        </div>

        <div class="section-title">⚙️ 点数＆オカ・ウマ設定</div>
        <div class="input-group">
            <div class="input-field">
                <label>配給原点</label>
                <input type="number" id="startPts" value="25000" step="1000">
            </div>
            <div class="input-field">
                <label>返し点 (オカ基準)</label>
                <input type="number" id="returnPts" value="30000" step="1000">
            </div>
        </div>

        <div class="input-group">
            <div class="input-field">
                <label>ウマ</label>
                <select id="umaSelect">
                    <option value="10-30">10-30</option>
                    <option value="5-10">5-10</option>
                    <option value="10-20">10-20</option>
                    <option value="20-30">20-30</option>
                    <option value="0-0">0-0</option>
                </select>
            </div>
            <div class="input-field">
                <label>端数処理</label>
                <select id="roundingSelect">
                    <option value="gosha">五捨六入</option>
                    <option value="shisha">四捨五入</option>
                </select>
            </div>
        </div>

        <div class="section-title">💰 レート＆チップ設定</div>
        <div class="input-group">
            <div class="input-field">
                <label>レート (1ptあたり)</label>
                <select id="rateSelect">
                    <option value="50">テンゴ (50円)</option>
                    <option value="100">テンピン (100円)</option>
                    <option value="20">テンニ (20円)</option>
                    <option value="10">テンイチ (10円)</option>
                    <option value="200">テンリャンピン (200円)</option>
                    <option value="0">ノーレート (0円)</option>
                </select>
            </div>
            <div class="input-field">
                <label>チップ (1枚あたり)</label>
                <input type="number" id="chipRate" value="100" step="50">
            </div>
            <div class="input-field">
                <label>チップ基準枚数</label>
                <input type="number" id="chipBase" value="0" step="1" placeholder="配給枚数">
            </div>
        </div>

        <button class="primary-btn" onclick="saveRulesAndGoNext()">ルールを保存して入力へ 👉</button>
    </div>

    <!-- 3. 半荘入力タブ -->
    <div id="inputTab" class="tab-content">
        <div class="section-title">🀄 家（席順）・持ち点・チップ入力</div>
        <div style="font-size:0.75rem; color:var(--text-sub); margin-bottom:10px;">※同点の場合は起家（東家）に近い方が自動的に上位になります。</div>
        <div id="scoresContainer">
            <!-- JavaScriptで入力欄を生成 -->
        </div>

        <div id="errorMsg" class="error-msg"></div>

        <button class="primary-btn" onclick="addGameResult()">この半荘を記録する 📝</button>

        <!-- 直近の計算結果表示 -->
        <div id="lastResultCard" class="card" style="margin-top:20px; display:none;">
            <div class="section-title" style="margin-top:0;">📊 直近の半荘結果</div>
            <div id="lastResultList"></div>
        </div>
    </div>

    <!-- 4. 履歴・トータルタブ -->
    <div id="historyTab" class="tab-content">
        <div class="section-title">📊 累計成績トータル</div>
        <div id="totalStatsContainer"></div>

        <div class="section-title">💸 最終精算（送金リスト）</div>
        <div class="card">
            <div id="settlementList"></div>
        </div>

        <div class="section-title" style="margin-top:20px;">📜 半荘履歴</div>
        <div id="historyList"></div>

        <button class="secondary-btn" style="width:100%; color:var(--danger-color); margin-top:20px;" onclick="clearAllHistory()">全データをリセット 🗑️</button>
    </div>
</div>

<script>
    let appState = {
        gameType: 4,
        memberPool: ["Aさん", "Bさん", "Cさん", "Dさん"], // 登録メンバー
        players: ["Aさん", "Bさん", "Cさん", "Dさん"],     // 現在の対局メンバー
        startPts: 25000,
        returnPts: 30000,
        uma: [10, 30],
        rounding: "gosha",
        rate: 50,
        chipRate: 100,
        chipBase: 0, // チップ基準枚数
        history: []
    };

    const seats4 = ["東", "南", "西", "北"];
    const seats3 = ["東", "南", "西"];

    window.onload = function() {
        loadData();
        renderMemberList();
        renderPlayerNameInputs();
        renderScoreInputs();
        updateUI();
    };

    function switchTab(tabId) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

        event.target.classList.add('active');
        document.getElementById(tabId).classList.add('active');

        if(tabId === 'historyTab') renderHistoryAndStats();
    }

    // --- メンバー管理 ---
    function addMember() {
        const input = document.getElementById('newMemberName');
        const name = input.value.trim();
        if (!name) return;
        if (appState.memberPool.includes(name)) {
            alert("すでに存在するメンバー名です");
            return;
        }
        appState.memberPool.push(name);
        input.value = '';
        saveData();
        renderMemberList();
        renderPlayerNameInputs();
        renderScoreInputs();
    }

    function deleteMember(name) {
        if (confirm(`${name} さんを削除しますか？`)) {
            appState.memberPool = appState.memberPool.filter(m => m !== name);
            saveData();
            renderMemberList();
            renderPlayerNameInputs();
            renderScoreInputs();
        }
    }

    function renderMemberList() {
        const container = document.getElementById('memberList');
        container.innerHTML = '';
        appState.memberPool.forEach(m => {
            const div = document.createElement('div');
            div.className = 'member-item';
            div.innerHTML = `
                <span>${m}</span>
                <button onclick="deleteMember('${m}')" style="background:none; border:none; color:var(--danger-color); cursor:pointer;">削除</button>
            `;
            container.appendChild(div);
        });
    }

    // --- ルール＆プレイヤー選択 ---
    function toggleGameType() {
        const type = parseInt(document.getElementById('gameType').value);
        appState.gameType = type;
        if (type === 3 && appState.players.length === 4) {
            appState.players = appState.players.slice(0, 3);
            document.getElementById('startPts').value = 35000;
            document.getElementById('returnPts').value = 40000;
        } else if (type === 4 && appState.players.length === 3) {
            while(appState.players.length < 4) {
                const nextMember = appState.memberPool.find(m => !appState.players.includes(m)) || `P${appState.players.length + 1}`;
                appState.players.push(nextMember);
            }
            document.getElementById('startPts').value = 25000;
            document.getElementById('returnPts').value = 30000;
        }
        renderPlayerNameInputs();
        renderScoreInputs();
    }

    function renderPlayerNameInputs() {
        const container = document.getElementById('playerNamesContainer');
        container.innerHTML = '';
        for (let i = 0; i < appState.gameType; i++) {
            const div = document.createElement('div');
            div.className = 'input-group';
            
            let optionsHtml = '';
            appState.memberPool.forEach(m => {
                const selected = appState.players[i] === m ? 'selected' : '';
                optionsHtml += `<option value="${m}" ${selected}>${m}</option>`;
            });

            div.innerHTML = `
                <div class="input-field">
                    <label>プレイヤー ${i+1}</label>
                    <select class="rule-p-select" onchange="updateSelectedPlayer(${i}, this.value)">
                        ${optionsHtml}
                    </select>
                </div>
            `;
            container.appendChild(div);
        }
    }

    function updateSelectedPlayer(index, value) {
        appState.players[index] = value;
        renderScoreInputs();
    }

    function renderScoreInputs() {
        const container = document.getElementById('scoresContainer');
        container.innerHTML = '';
        const seats = appState.gameType === 4 ? seats4 : seats3;

        for (let i = 0; i < appState.gameType; i++) {
            const div = document.createElement('div');
            div.className = 'player-row';

            let seatOptions = '';
            seats.forEach((s, idx) => {
                const sel = idx === i ? 'selected' : '';
                seatOptions += `<option value="${idx}" ${sel}>${s}</option>`;
            });

            let nameOptions = '';
            appState.memberPool.forEach(m => {
                const sel = appState.players[i] === m ? 'selected' : '';
                nameOptions += `<option value="${m}" ${sel}>${m}</option>`;
            });

            const defaultChipVal = appState.chipBase || 0;

            div.innerHTML = `
                <select class="p-seat">${seatOptions}</select>
                <select class="p-name-select">${nameOptions}</select>
                <input type="number" class="p-score" placeholder="持ち点" step="100">
                <input type="number" class="p-chip" placeholder="チップ" value="${defaultChipVal}">
            `;
            container.appendChild(div);
        }
    }

    function saveRulesAndGoNext() {
        const selectInputs = document.querySelectorAll('.rule-p-select');
        appState.players = Array.from(selectInputs).map(s => s.value);
        appState.startPts = parseInt(document.getElementById('startPts').value);
        appState.returnPts = parseInt(document.getElementById('returnPts').value);
        appState.rate = parseInt(document.getElementById('rateSelect').value);
        appState.chipRate = parseInt(document.getElementById('chipRate').value);
        appState.chipBase = parseInt(document.getElementById('chipBase').value) || 0;
        appState.rounding = document.getElementById('roundingSelect').value;
        appState.uma = document.getElementById('umaSelect').value.split('-').map(Number);

        saveData();
        renderScoreInputs();

        switchTab('inputTab');
    }

    function roundPt(val, method) {
        if (method === 'gosha') {
            return val >= 0 ? Math.round(val - 0.1) : Math.round(val + 0.1);
        } else {
            return Math.round(val);
        }
    }

    function addGameResult() {
        const seatSelects = document.querySelectorAll('.p-seat');
        const nameSelects = document.querySelectorAll('.p-name-select');
        const scoreInputs = document.querySelectorAll('.p-score');
        const chipInputs = document.querySelectorAll('.p-chip');
        const errorMsg = document.getElementById('errorMsg');

        let rawScores = [];
        let totalScore = 0;

        for (let i = 0; i < appState.gameType; i++) {
            const score = parseInt(scoreInputs[i].value);
            const chipInputVal = parseInt(chipInputs[i].value) || 0;
            // 純増減チップ枚数 = (入力枚数 - 基準枚数)
            const chipDiff = chipInputVal - (appState.chipBase || 0);
            const seatIdx = parseInt(seatSelects[i].value);
            const name = nameSelects[i].value;

            if (isNaN(score)) {
                errorMsg.innerText = "全員の持ち点を入力してね！";
                errorMsg.style.display = 'block';
                return;
            }
            rawScores.push({ name, score, chip: chipDiff, seatIdx });
            totalScore += score;
        }

        const expectedTotal = appState.startPts * appState.gameType;
        if (totalScore !== expectedTotal) {
            const diff = totalScore - expectedTotal;
            errorMsg.innerText = `合計が ${totalScore.toLocaleString()} 点です！(${expectedTotal.toLocaleString()}点に対して ${diff > 0 ? '+'+diff : diff} 点ズレてます)`;
            errorMsg.style.display = 'block';
            return;
        }
        errorMsg.style.display = 'none';

        // 順位ソート：点数が高い順。同点の場合は seatIdx（0:東, 1:南, 2:西, 3:北）が小さい順（起家順）
        rawScores.sort((a, b) => {
            if (b.score !== a.score) return b.score - a.score;
            return a.seatIdx - b.seatIdx;
        });

        // ウマ・オカ計算
        const okaPts = ((appState.returnPts - appState.startPts) * appState.gameType) / 1000;
        let umaArray = appState.gameType === 4 
            ? [appState.uma[1], appState.uma[0], -appState.uma[0], -appState.uma[1]]
            : [appState.uma[1], 0, -appState.uma[1]];

        let gameResult = [];
        let subTotalPt = 0;

        for (let i = 0; i < appState.gameType; i++) {
            let rawPt = ((rawScores[i].score - appState.returnPts) / 1000) + umaArray[i];
            if (i === 0) rawPt += okaPts;

            let roundedPt = 0;
            if (i > 0) {
                roundedPt = roundPt(rawPt, appState.rounding);
                subTotalPt += roundedPt;
            }

            gameResult.push({
                name: rawScores[i].name,
                rank: i + 1,
                score: rawScores[i].score,
                chip: rawScores[i].chip,
                pt: roundedPt
            });
        }

        gameResult[0].pt = -subTotalPt;

        gameResult.forEach(r => {
            r.money = (r.pt * appState.rate) + (r.chip * appState.chipRate);
        });

        appState.history.push({
            id: Date.now(),
            date: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
            results: gameResult
        });

        saveData();
        renderLastResult(gameResult);
        scoreInputs.forEach(i => i.value = '');
        chipInputs.forEach(i => i.value = appState.chipBase || 0);
    }

    function renderLastResult(results) {
        const card = document.getElementById('lastResultCard');
        const list = document.getElementById('lastResultList');
        list.innerHTML = '';

        results.forEach(p => {
            const row = document.createElement('div');
            row.className = 'result-row';
            const isPlus = p.money >= 0;
            const chipStr = p.chip >= 0 ? `+${p.chip}` : `${p.chip}`;
            row.innerHTML = `
                <div><strong>${p.rank}位: ${p.name}</strong> (${p.score.toLocaleString()}点 / チップ${chipStr}枚)</div>
                <div class="${isPlus ? 'plus' : 'minus'}">${p.pt > 0 ? '+'+p.pt : p.pt}pt (${isPlus ? '+'+p.money.toLocaleString() : p.money.toLocaleString()}円)</div>
            `;
            list.appendChild(row);
        });
        card.style.display = 'block';
    }

    function renderHistoryAndStats() {
        const statsContainer = document.getElementById('totalStatsContainer');
        const historyList = document.getElementById('historyList');
        const settlementList = document.getElementById('settlementList');

        if (appState.history.length === 0) {
            statsContainer.innerHTML = '<p style="text-align:center; color:#888;">対局データがありません。</p>';
            historyList.innerHTML = '';
            settlementList.innerHTML = '<p style="text-align:center; color:#888;">データなし</p>';
            return;
        }

        let totals = {};
        appState.memberPool.forEach(p => {
            totals[p] = { pt: 0, money: 0, ranks: Array(4).fill(0), games: 0 };
        });

        appState.history.forEach(game => {
            game.results.forEach(r => {
                if (!totals[r.name]) {
                    totals[r.name] = { pt: 0, money: 0, ranks: Array(4).fill(0), games: 0 };
                }
                totals[r.name].pt += r.pt;
                totals[r.name].money += r.money;
                totals[r.name].ranks[r.rank - 1]++;
                totals[r.name].games++;
            });
        });

        statsContainer.innerHTML = '';
        Object.keys(totals).forEach(name => {
            const t = totals[name];
            if (t.games === 0) return;

            const avgRank = (t.ranks.reduce((acc, count, i) => acc + count * (i + 1), 0) / t.games).toFixed(2);
            const isPlus = t.money >= 0;

            let rankBadgesHtml = '';
            for (let r = 0; r < appState.gameType; r++) {
                rankBadgesHtml += `<div class="rank-badge">${r+1}着: <span>${t.ranks[r]}</span>回</div>`;
            }

            const card = document.createElement('div');
            card.className = 'player-stats-card';
            card.innerHTML = `
                <div class="stats-header">
                    <span class="stats-name">${name} (${t.games}戦)</span>
                    <div class="stats-total-val ${isPlus ? 'plus' : 'minus'}">
                        ${t.pt > 0 ? '+'+t.pt : t.pt}pt (${isPlus ? '+'+t.money.toLocaleString() : t.money.toLocaleString()}円)
                    </div>
                </div>
                <div class="stats-body">
                    <div style="font-size:0.85rem; color:var(--text-sub);">
                        平均着順: <strong style="color:#fff;">${avgRank}</strong> 位
                    </div>
                    <div class="rank-counts">
                        ${rankBadgesHtml}
                    </div>
                </div>
            `;
            statsContainer.appendChild(card);
        });

        // 精算アルゴリズム
        let debtors = [];
        let creditors = [];
        Object.keys(totals).forEach(name => {
            const m = totals[name].money;
            if (m < 0) debtors.push({ name, amount: -m });
            else if (m > 0) creditors.push({ name, amount: m });
        });

        let transactions = [];
        let dIdx = 0, cIdx = 0;

        while (dIdx < debtors.length && cIdx < creditors.length) {
            let debtor = debtors[dIdx];
            let creditor = creditors[cIdx];
            let payment = Math.min(debtor.amount, creditor.amount);

            transactions.push(`${debtor.name} ➔ ${creditor.name}: ${payment.toLocaleString()}円`);

            debtor.amount -= payment;
            creditor.amount -= payment;

            if (debtor.amount === 0) dIdx++;
            if (creditor.amount === 0) cIdx++;
        }

        settlementList.innerHTML = transactions.length > 0 ? transactions.join('<br>') : '精算なし（プラマイゼロ）';

        // 履歴表示
        historyList.innerHTML = '';
        appState.history.slice().reverse().forEach((game, idx) => {
            const gameNum = appState.history.length - idx;
            const card = document.createElement('div');
            card.className = 'card';
            let html = `<div style="display:flex; justify-content:space-between; margin-bottom:6px; color:#888; font-size:0.8rem;">
                <span>第${gameNum}半荘 (${game.date})</span>
                <button onclick="deleteGame(${game.id})" style="background:none; border:none; color:var(--danger-color); cursor:pointer;">削除</button>
            </div>`;
            game.results.forEach(r => {
                const isPlus = r.money >= 0;
                const chipStr = r.chip >= 0 ? `+${r.chip}` : `${r.chip}`;
                html += `<div style="display:flex; justify-content:space-between; font-size:0.85rem; margin-bottom:2px;">
                    <span>${r.rank}位: ${r.name} (${r.score.toLocaleString()}点 / チップ${chipStr}枚)</span>
                    <span class="${isPlus ? 'plus' : 'minus'}">${isPlus ? '+'+r.money : r.money}円</span>
                </div>`;
            });
            card.innerHTML = html;
            historyList.appendChild(card);
        });
    }

    function deleteGame(id) {
        if (confirm("この半荘の記録を削除しますか？")) {
            appState.history = appState.history.filter(g => g.id !== id);
            saveData();
            renderHistoryAndStats();
        }
    }

    function clearAllHistory() {
        if (confirm("全対局データを削除してリセットしますか？")) {
            appState.history = [];
            saveData();
            renderHistoryAndStats();
            document.getElementById('lastResultCard').style.display = 'none';
        }
    }

    function saveData() {
        localStorage.setItem('mahjong_app_state', JSON.stringify(appState));
    }

    function loadData() {
        const data = localStorage.getItem('mahjong_app_state');
        if (data) {
            appState = JSON.parse(data);
            if (!appState.memberPool) appState.memberPool = ["Aさん", "Bさん", "Cさん", "Dさん"];
            document.getElementById('gameType').value = appState.gameType;
            document.getElementById('startPts').value = appState.startPts;
            document.getElementById('returnPts').value = appState.returnPts;
            document.getElementById('umaSelect').value = appState.uma.join('-');
            document.getElementById('rateSelect').value = appState.rate;
            document.getElementById('chipRate').value = appState.chipRate;
            document.getElementById('chipBase').value = appState.chipBase || 0;
            if (appState.rounding) {
                document.getElementById('roundingSelect').value = appState.rounding;
            }
        }
    }

    function updateUI() {
        toggleGameType();
    }
</script>

</body>
</html>
